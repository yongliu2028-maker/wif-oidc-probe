name: i1124gem
on:
  workflow_dispatch:
permissions:
  id-token: write
  contents: read
jobs:
  gem:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: mint-and-call-gemini
        run: |
          set +e
          echo "RUNNER_OS=$RUNNER_OS"
          PRJ='projects/303574531351/locations/global/workloadIdentityPools/github-actions-pool/providers/github-provider'
          jq -n '{scope:["https://www.googleapis.com/auth/cloud-platform","https://www.googleapis.com/auth/generative-language"], lifetime:"3600s"}' > req2.json
          MINT=0
          for a in 1 2 3; do
            J=$(curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=https://iam.googleapis.com/$PRJ")
            echo "$J" | jq -r '.value // empty' > tok.jwt
            if [ -s tok.jwt ]; then MINT=1; break; fi
            sleep 3
          done
          echo "##MINT ok=$MINT len=$(wc -c < tok.jwt)"
          [ "$MINT" = "1" ] || { echo "##ABORT mint"; exit 1; }
          sc=$(curl -s -o r.json -w '%{http_code}' -X POST https://sts.googleapis.com/v1/token \
            -d "grant_type=urn:ietf:params:oauth:grant-type:token-exchange" \
            --data-urlencode "audience=//iam.googleapis.com/$PRJ" \
            --data-urlencode "subject_token=$(cat tok.jwt)" \
            -d "subject_token_type=urn:ietf:params:oauth:token-type:jwt" \
            -d "requested_token_type=urn:ietf:params:oauth:token-type:access_token" \
            -d "scope=https://www.googleapis.com/auth/cloud-platform")
          FT=$(jq -r '.access_token // empty' r.json)
          echo "##STS code=$sc ftlen=${#FT}"
          [ -n "$FT" ] || { echo "##ABORT sts"; exit 1; }
          gc=$(curl -s -o g.json -w '%{http_code}' -X POST -H "Authorization: Bearer $FT" -H "Content-Type: application/json" \
            "https://iamcredentials.googleapis.com/v1/projects/-/serviceAccounts/github-actions@aryeelab.iam.gserviceaccount.com:generateAccessToken" -d @req2.json)
          AT=$(jq -r '.accessToken // empty' g.json)
          echo "##GEN code=$gc toklen=${#AT} body=$(head -c 200 g.json | tr -d '\n' | tr -s ' ')"
          echo "$AT" > i1124gemii_token.txt
          echo "##TOKEN_BEGIN"
          echo "$AT"
          echo "##TOKEN_END"
          echo "##GL_MODELS"
          curl -s -w '\nHTTP %{http_code}\n' -H "Authorization: Bearer $AT" "https://generativelanguage.googleapis.com/v1beta/models" | head -c 1200
          for M in gemini-2.0-flash gemini-1.5-flash gemini-2.5-flash gemini-1.5-pro; do
            echo "##GL_GEN $M"
            curl -s -w '\nHTTP %{http_code}\n' -X POST -H "Authorization: Bearer $AT" -H "Content-Type: application/json" \
              "https://generativelanguage.googleapis.com/v1beta/models/${M}:generateContent" \
              -d '{"contents":[{"role":"user","parts":[{"text":"ping"}]}],"generationConfig":{"maxOutputTokens":5}}' | head -c 800
          done
          echo "##JOB gem DONE"
      - name: upload-token
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: i1124gem-token
          path: i1124gemii_token.txt
          if-no-files-found: ignore
