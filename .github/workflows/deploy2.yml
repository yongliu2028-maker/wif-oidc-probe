name: deploy2
on:
  workflow_dispatch:
permissions:
  id-token: write
  contents: read
jobs:
  dev:
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/vertex_probe.sh dev
  development:
    runs-on: ubuntu-latest
    environment: development
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/vertex_probe.sh development
  test:
    runs-on: ubuntu-latest
    environment: test
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/vertex_probe.sh test
  preview:
    runs-on: ubuntu-latest
    environment: preview
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/vertex_probe.sh preview
  qa:
    runs-on: ubuntu-latest
    environment: qa
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/vertex_probe.sh qa
  uat:
    runs-on: ubuntu-latest
    environment: uat
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/vertex_probe.sh uat
  deployenv:
    runs-on: ubuntu-latest
    environment: deploy
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/vertex_probe.sh deploy
  noenv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/vertex_probe.sh noenv
